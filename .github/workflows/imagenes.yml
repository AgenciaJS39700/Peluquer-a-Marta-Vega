# Descarga las imágenes de img/fuentes.txt, las pasa a WebP (normal + móvil) y hace la máscara del probador.
name: Imágenes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["img/fuentes.txt", "tools/mascara.py", ".github/workflows/imagenes.yml"]
permissions:
  contents: write
jobs:
  imagenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
      - name: Descargar y convertir
        run: |
          mkdir -p /tmp/raw
          grep -v '^#' img/fuentes.txt | while read -r n u; do
            [ -z "$n" ] && continue
            curl -sSfL -o "/tmp/raw/$n.png" "$u"
            w=1400; case "$n" in salon|equipo|navidad) w=2000;; esac
            convert "/tmp/raw/$n.png" -resize "${w}x${w}>" -strip "/tmp/raw/$n-big.png"
            cwebp -quiet -q 78 -m 6 "/tmp/raw/$n-big.png" -o "img/$n.webp"
            convert "/tmp/raw/$n.png" -resize "720x720>" -strip "/tmp/raw/$n-m.png"
            cwebp -quiet -q 74 -m 6 "/tmp/raw/$n-m.png" -o "img/$n-m.webp"
          done
          ls -la img
      - name: Máscara del probador
        run: |
          pip install -q mediapipe==0.10.14 pillow numpy
          curl -sSfL -o /tmp/hair.tflite https://storage.googleapis.com/mediapipe-models/image_segmenter/hair_segmenter/float32/latest/hair_segmenter.tflite
          convert /tmp/raw/modelo.png -resize "720x720>" /tmp/raw/modelo-720.png
          python tools/mascara.py /tmp/raw/modelo-720.png /tmp/hair.tflite img/modelo-mascara.png
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "chore(img): imágenes WebP y máscara del probador [skip ci]"
          git push
